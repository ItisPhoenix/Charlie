name: Charlie one-time CI formatting repair
on:
  push:
    branches:
      - charlie/phase1/ci-security-fixes
permissions:
  contents: write
jobs:
  safe-format:
    if: github.repository == 'ItisPhoenix/Charlie'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: charlie/phase1/ci-security-fixes
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply only Biome's safe fixes
        shell: bash
        run: |
          pnpm exec biome check --write . || true
          git diff --check
          count="$(git diff --name-only | wc -l)"
          echo "FORMAT_CHANGED_FILES=$count"
          git diff --stat
          if (( count > 60 )); then
            echo 'Too many changes: refusing to commit'
            exit 1
          fi
      - name: Commit safe formatting to Charlie branch
        shell: bash
        run: |
          if test -z "$(git diff --name-only)"; then
            echo "NO_FORMAT_CHANGES"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply Biome safe formatting fixes for Phase 1 CI"
          git push origin HEAD:refs/heads/charlie/phase1/ci-security-fixes
